name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, package, and release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: |
          go test ./...
          go vet ./...

      - name: Build release packages
        run: ./scripts/package-release.sh "$GITHUB_REF_NAME"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --prerelease --title "prosecheck $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "prosecheck $GITHUB_REF_NAME"
          fi
